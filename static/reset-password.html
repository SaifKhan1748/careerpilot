<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <div class="auth-card">
    <div class="logo">CareerPilot</div>
    <p class="tagline">Set a new password</p>
    <form id="reset-form" onsubmit="return doReset(event)">
      <input type="password" id="new-password" placeholder="New password" required>
      <button type="submit" class="primary-btn">Reset Password</button>
    </form>
    <p class="error" id="error-msg"></p>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    async function doReset(e) {
      e.preventDefault();
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: document.getElementById('new-password').value }),
      });
      const data = await res.json();
      if (!res.ok) { document.getElementById('error-msg').textContent = data.detail || 'Reset failed'; return false; }
      document.getElementById('error-msg').style.color = '#4ade80';
      document.getElementById('error-msg').textContent = 'Password reset! Redirecting to login...';
      setTimeout(() => window.location.href = '/', 1500);
      return false;
    }
  </script>
</body></html>
